name: Plugin bug
description: Report a reproducible problem in a catalog plugin.
title: "[Plugin bug]: "
labels: [bug]
body:
  - type: input
    id: plugin
    attributes:
      label: Plugin ID and version
      placeholder: example.weather 1.0.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Do not include tokens, personal messages, file contents, or other private data.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Mewmori and macOS versions
    validations:
      required: true
